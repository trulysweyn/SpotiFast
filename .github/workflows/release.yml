name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build app and updater helper
        env:
          CARGO_TERM_COLOR: always
        run: cargo build --release --bins

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\spotifast.exe dist\SpotiFast.exe
          Copy-Item target\release\spotifast_updater.exe dist\SpotiFastUpdater.exe

      - name: Download player tools for installer
        shell: pwsh
        run: |
          $headers = @{ 'User-Agent' = 'SpotiFast-release-build' }
          $ytRelease = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest'
          $ytAsset = $ytRelease.assets | Where-Object { $_.name -eq 'yt-dlp.exe' } | Select-Object -First 1
          if (-not $ytAsset) { throw 'The latest yt-dlp release did not include yt-dlp.exe.' }

          $ytDir = 'dist\tools\yt-dlp'
          $mpvDir = 'dist\tools\mpv'
          New-Item -ItemType Directory -Force -Path $ytDir, $mpvDir | Out-Null
          Invoke-WebRequest -Headers $headers -Uri $ytAsset.browser_download_url -OutFile (Join-Path $ytDir 'yt-dlp.exe')

          $mpvRelease = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest'
          $mpvAsset = $mpvRelease.assets | Where-Object { $_.name -like 'mpv-x86_64-*.7z' } | Select-Object -First 1
          if (-not $mpvAsset) { throw 'The latest mpv release did not include a compatible x86_64 archive.' }

          $sevenZip = Join-Path ([Environment]::GetFolderPath('ProgramFiles')) '7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip)) {
            $sevenZip = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) '7-Zip\7z.exe'
          }
          if (-not (Test-Path -LiteralPath $sevenZip)) { throw '7-Zip was not found on the Windows runner.' }
          $archive = 'dist\mpv.7z'
          $extractDir = 'dist\mpv-extracted'
          Invoke-WebRequest -Headers $headers -Uri $mpvAsset.browser_download_url -OutFile $archive
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          & $sevenZip x $archive "-o$extractDir" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not unpack mpv (7-Zip exit code $LASTEXITCODE)." }
          $mpvExe = Get-ChildItem -Path $extractDir -Filter 'mpv.exe' -Recurse | Select-Object -First 1
          if (-not $mpvExe) { throw 'The mpv archive did not contain mpv.exe.' }
          Copy-Item -Path (Join-Path $mpvExe.DirectoryName '*') -Destination $mpvDir -Recurse -Force

      - name: Build single-file installer
        shell: pwsh
        run: |
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $compiler) {
            $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
            $candidate = Join-Path $programFilesX86 'Inno Setup 6\ISCC.exe'
            if (-not (Test-Path -LiteralPath $candidate)) { throw 'Inno Setup compiler was not found.' }
            $compilerPath = $candidate
          } else {
            $compilerPath = $compiler.Source
          }
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          & $compilerPath "/DMyAppVersion=$version" installer\SpotiFast.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME `
            dist\SpotiFast.exe `
            dist\SpotiFastUpdater.exe `
            dist\SpotiFast-Setup.exe `
            --title $env:GITHUB_REF_NAME `
            --generate-notes
