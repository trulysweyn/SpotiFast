[package]
name = "spotifast"
version = "0.5.6"
edition = "2021"

[dependencies]
eframe = "0.37"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", features = ["json"] }
sevenz-rust = "0.6"
winreg = "0.55"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
[build-dependencies]
winres = "0.1"
